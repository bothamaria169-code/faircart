<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 150" width="540" height="150" role="img" aria-label="FairCart">
  <!--
    Horizontal logo lockup for dark or photographic backgrounds — cover
    photos, dark-mode app surfaces, banners over an image. Same mark and
    layout as faircart-logo.svg; only the wordmark colour changes, matching
    the footer's brand__word override in includes/footer.php.
  -->
  <defs>
    <linearGradient id="fcBodyLogoDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12805C"/>
      <stop offset="1" stop-color="#0C6247"/>
    </linearGradient>
  </defs>

  <g transform="translate(15,15) scale(1.875)">
    <rect width="64" height="64" rx="16" fill="url(#fcBodyLogoDark)"/>
    <path d="M14 26 h36 l-4.2 21.5 a4 4 0 0 1 -3.9 3.2 h-19.8 a4 4 0 0 1 -3.9 -3.2 z"
          fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M22 26 v-4 h6 v-5 h6 v-6 h8"
          fill="none" stroke="#E9A21B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="11" r="3.4" fill="#E9A21B"/>
  </g>

  <text x="164" y="99" font-family="'Bricolage Grotesque','Plus Jakarta Sans',Arial,sans-serif"
        font-weight="800" font-size="70" letter-spacing="-2">
    <tspan fill="#FFFFFF">Fair</tspan><tspan fill="#1FA97A">Cart</tspan>
  </text>
</svg>
