<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FairCart">
  <!--
    Square/circle profile-picture icon — same mark as the site favicon
    (assets/img/logo/faircart-mark.svg), redrawn on a full circle so it
    survives every platform's automatic circular crop (Facebook, Instagram,
    LinkedIn, X, TikTok, WhatsApp Business all crop square uploads to a
    circle). The basket + rising-line handle sits inside a safe zone well
    inside the circle's edge, so nothing gets clipped.

    Use this file directly as the profile photo upload on any platform.
  -->
  <defs>
    <linearGradient id="fcBodyIcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12805C"/>
      <stop offset="1" stop-color="#0C6247"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#fcBodyIcon)"/>

  <!-- glyph: basket + rising handle + dot, scaled and centred from the
       64-unit source mark (scale 7, centred on the circle) -->
  <g transform="translate(32,50.9) scale(7)">
    <path d="M14 26 h36 l-4.2 21.5 a4 4 0 0 1 -3.9 3.2 h-19.8 a4 4 0 0 1 -3.9 -3.2 z"
          fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M22 26 v-4 h6 v-5 h6 v-6 h8"
          fill="none" stroke="#E9A21B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="11" r="3.4" fill="#E9A21B"/>
  </g>
</svg>
