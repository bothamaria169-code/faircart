<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FairCart">
  <!-- A basket whose handle doubles as a rising line: the shop and the margin
       in one mark. Two tones only, so it works at 20px in a browser tab. -->
  <defs>
    <linearGradient id="fcBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12805C"/>
      <stop offset="1" stop-color="#0C6247"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#fcBody)"/>
  <!-- basket -->
  <path d="M14 26 h36 l-4.2 21.5 a4 4 0 0 1 -3.9 3.2 h-19.8 a4 4 0 0 1 -3.9 -3.2 z"
        fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- rising handle: three steps up, not an arc -->
  <path d="M22 26 v-4 h6 v-5 h6 v-6 h8"
        fill="none" stroke="#E9A21B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="42" cy="11" r="3.4" fill="#E9A21B"/>
</svg>
